<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Sinoptik Roman | 2025</title>
    <link rel="stylesheet" href="style.css?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ── КРИТИЧЕСКИЕ МОБИЛЬНЫЕ ФИКСЫ (inline, чтобы точно применились) ── */

        .apple-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            width: 100%;
        }

        .search-container {
            flex: 1;
            min-width: 0;
        }

        .quick-settings {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* Hero всегда по центру */
        .hero-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .hero-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .temp-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Детали комфорта — всегда flex */
        .c-item {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            width: 100% !important;
        }

        .c-item b {
            display: block !important;
            text-align: right !important;
            min-width: 80px !important;
        }

        @media (max-width: 640px) {
            .sf-wrapper {
                padding: 14px 14px 40px;
                overflow-x: hidden;
            }

            /* Шапка — всё в одну строку */
            .apple-nav {
                flex-wrap: nowrap;
            }

            .sf-select {
                width: 52px !important;
                height: 44px !important;
                font-size: 11px !important;
                border-radius: 14px !important;
                display: block !important;
            }

            /* Hero */
            .hero-card {
                padding: 24px 16px !important;
                gap: 10px !important;
                min-height: auto !important;
            }

            .hero-header h1 { font-size: 26px !important; }

            .main-icon,
            .main-weather-svg {
                width: 100px !important;
                height: 100px !important;
            }

            #temp {
                font-size: 76px !important;
                letter-spacing: -4px !important;
            }

            .degree-top {
                font-size: 26px !important;
                margin-top: 8px !important;
            }

            /* Виджеты */
            .widgets-container {
                display: flex !important;
                flex-direction: column !important;
                gap: 12px !important;
            }

            .widget {
                padding: 16px !important;
                border-radius: 18px !important;
            }

            /* Почасовой */
            .hour-item {
                min-width: 68px !important;
                padding: 10px 8px !important;
            }

            .hour-icon {
                width: 36px !important;
                height: 36px !important;
            }

            /* Солнце + AQI рядом */
            .small-widgets {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 12px !important;
            }

            /* Детали комфорта */
            .c-item span { font-size: 13px !important; }
            .c-item b    { font-size: 13px !important; }

            /* Прогноз 5 дней */
            .forecast-item {
                grid-template-columns: 78px 38px 1fr auto !important;
                padding: 12px 14px !important;
                gap: 8px !important;
            }

            .f-icon-svg {
                width: 36px !important;
                height: 36px !important;
                min-width: 36px !important;
            }

            .fd-max { font-size: 14px !important; }
            .fd-min { font-size: 11px !important; }
        }
    </style>
</head>
<body>
    <div class="sf-wrapper">
        <header class="apple-nav">
            <div class="search-container">
                <input type="text" id="cityInput" placeholder="Поиск города..." autocomplete="off">
                <button id="searchBtn" class="search-icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M21 21L16.65 16.65" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="quick-settings">
                <select id="langSelect" class="sf-select">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="de">DE</option>
                    <option value="fr">FR</option>
                    <option value="es">ES</option>
                    <option value="it">IT</option>
                </select>
                <select id="unitSelect" class="sf-select">
                    <option value="metric">°C</option>
                    <option value="imperial">°F</option>
                </select>
            </div>
        </header>

        <nav class="ios-tabs">
            <div class="tabs-bg">
                <button class="tab-btn active" id="btnToday">Сегодня</button>
                <button class="tab-btn" id="btn5Days">5 дней</button>
            </div>
        </nav>

        <main id="today-view" class="content-grid active">
            <section class="hero-card">
                <div class="hero-header">
                    <h1 id="cityName">--</h1>
                    <p id="date" class="sf-date">--</p>
                </div>
                <div class="hero-visual">
                    <div id="weatherIcon" class="main-icon floating main-weather-svg"></div>
                    <div class="temp-wrapper">
                        <div class="temp-flex">
                            <span id="temp">--</span>
                            <span class="degree-top">°</span>
                        </div>
                        <p id="description" class="sf-desc">--</p>
                        <p class="feels-like">RealFeel <span id="feelsLike">--</span>°</p>
                    </div>
                </div>
            </section>

            <div class="widgets-container">
                <div class="widget">
                    <h3 class="widget-title">Почасовой прогноз</h3>
                    <div class="hourly-scroll" id="hourlyList"></div>
                </div>
                <div class="small-widgets">
                    <div class="widget">
                        <h3 class="widget-title">Солнце</h3>
                        <div class="sun-info">
                            <div class="sun-row"><span>Восход</span><b id="sunrise">--:--</b></div>
                            <div class="sun-row"><span>Закат</span><b id="sunset">--:--</b></div>
                        </div>
                    </div>
                    <div class="widget">
                        <h3 class="widget-title">Воздух (AQI)</h3>
                        <p id="aqi-text" class="aqi-status">--</p>
                        <div class="aqi-bar"><div id="aqi-progress"></div></div>
                        <p class="aqi-desc">Качество воздуха влияет на ваше здоровье.</p>
                    </div>
                </div>
                <div class="widget">
                    <h3 class="widget-title">Детали комфорта</h3>
                    <div class="comfort-grid">
                        <div class="c-item"><span>Влажность</span><b id="humidity">--%</b></div>
                        <div class="c-item"><span>Ветер</span><b id="wind">--</b></div>
                        <div class="c-item"><span>Давление</span><b id="pressure">--</b></div>
                        <div class="c-item"><span>Видимость</span><b id="visibility">--</b></div>
                    </div>
                </div>
            </div>
        </main>

        <main id="forecast-view" class="content-grid">
            <div class="widget full-width">
                <h3 class="widget-title">Прогноз на 5 дней</h3>
                <div id="fiveDayForecast" class="forecast-list"></div>
            </div>
        </main>
    </div>
    <script src="script.js?v=10"></script>
</body>
</html>
